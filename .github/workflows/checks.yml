name: Project Rise checks
on:
  push:
    branches: [main, feature/season-career-v02, feature/all-positions-v03, feature/live-arena-v04]
  pull_request:
    branches: [main]
jobs:
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check engine/league.js
          node --check engine/roles.js
          node --check v02.js
          node --check v03.js
          node --check arena/engine.js
          node --check arena/view.js
          node --check v04.js
      - name: Career game rule tests
        run: node --test tests/*.test.cjs
